config.directory=/config
server.port=4567
max.task.workers = 5
default.max.tasks.per.user = 40
default.max.tasks.per.epa.user = 1000
file.store.path=/app-data
geoserver.url=http://colo-wtest-1:8080/geoserver/rest
geoserver.username=admin
geoserver.password=geoserver
geoserver.store=benmap_grids
geoserver.workspace=benmap

# Per-task-type Kubernetes pod resources. Defaults are baked into TaskResources.java;
# uncomment any of the lines below to override for this deployment. The slug after
# "task.resources." is the task type lowercased with spaces replaced by underscores.
# Memory units follow Kubernetes Quantity syntax (e.g. 8G, 32Gi). memory_limit is
# applied as a hard ceiling; no CPU limit is set.
#
# task.resources.hif.cpu = 8
# task.resources.hif.memory = 32G
# task.resources.hif.memory_limit = 32G
#
# task.resources.exposure.cpu = 8
# task.resources.exposure.memory = 32G
# task.resources.exposure.memory_limit = 32G
#
# task.resources.valuation.cpu = 4
# task.resources.valuation.memory = 16G
# task.resources.valuation.memory_limit = 16G
#
# task.resources.grid_import.cpu = 4
# task.resources.grid_import.memory = 16G
# task.resources.grid_import.memory_limit = 16G
#
# task.resources.aq_import.cpu = 2
# task.resources.aq_import.memory = 8G
# task.resources.aq_import.memory_limit = 8G
#
# task.resources.result_export.cpu = 2
# task.resources.result_export.memory = 16G
# task.resources.result_export.memory_limit = 16G